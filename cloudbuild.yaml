steps:
  # 1. Build Docker image using the multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/journal-repo/personal-gemini-journal:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/journal-repo/personal-gemini-journal:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/journal-repo/personal-gemini-journal'

  # 3. Deploy to Cloud Run with Secret Manager binding
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SECRETS_PARAM="GEMINI_API_KEY=GEMINI_API_KEY:latest"
        if gcloud secrets describe CRON_SECRET --project="$PROJECT_ID" >/dev/null 2>&1; then
          echo "CRON_SECRET found in Secret Manager, binding to Cloud Run"
          SECRETS_PARAM="$$SECRETS_PARAM,CRON_SECRET=CRON_SECRET:latest"
        fi

        if gcloud secrets describe FIREBASE_APPLET_CONFIG --project="$PROJECT_ID" >/dev/null 2>&1; then
          echo "FIREBASE_APPLET_CONFIG found in Secret Manager, binding to Cloud Run"
          SECRETS_PARAM="$$SECRETS_PARAM,FIREBASE_APPLET_CONFIG=FIREBASE_APPLET_CONFIG:latest"
        fi

        gcloud run deploy personal-gemini-journal \
          --image "$_REGION-docker.pkg.dev/$PROJECT_ID/journal-repo/personal-gemini-journal:$COMMIT_SHA" \
          --region "$_REGION" \
          --platform managed \
          --allow-unauthenticated \
          --set-secrets="$$SECRETS_PARAM" \
          --memory 512Mi \
          --cpu 1

  # 4. Provision / Synchronize Hourly Cloud Scheduler Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe personal-gemini-journal --region "$_REGION" --project="$PROJECT_ID" --format='value(status.url)' 2>/dev/null || true)
        echo "Cloud Run Service URL: $$SERVICE_URL"
        if [ -z "$$SERVICE_URL" ]; then
          echo "Warning: Cloud Run service URL could not be determined. Skipping scheduler setup."
          exit 0
        fi

        JOB_NAME="hourly-journal-distiller"
        TARGET_URI="$$SERVICE_URL/api/cron/hourly-distill"

        HEADERS_ARG="Content-Type=application/json"
        if gcloud secrets describe CRON_SECRET --project="$PROJECT_ID" >/dev/null 2>&1; then
          SECRET_VAL=$(gcloud secrets versions access latest --secret=CRON_SECRET --project="$PROJECT_ID" 2>/dev/null || true)
          if [ -n "$$SECRET_VAL" ]; then
            HEADERS_ARG="Content-Type=application/json,Authorization=Bearer $$SECRET_VAL"
          fi
        fi

        gcloud services enable cloudscheduler.googleapis.com --project="$PROJECT_ID" --quiet 2>/dev/null || true

        if gcloud scheduler jobs describe "$$JOB_NAME" --location="$_REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
          echo "Updating existing Cloud Scheduler job: $$JOB_NAME"
          gcloud scheduler jobs update http "$$JOB_NAME" \
            --location="$_REGION" \
            --schedule="0 * * * *" \
            --uri="$$TARGET_URI" \
            --http-method=POST \
            --headers="$$HEADERS_ARG" \
            --message-body='{}' \
            --time-zone="UTC" \
            --project="$PROJECT_ID" || echo "Notice: Service Account lacks Cloud Scheduler update permission."
        else
          echo "Creating new Cloud Scheduler job: $$JOB_NAME"
          gcloud scheduler jobs create http "$$JOB_NAME" \
            --location="$_REGION" \
            --schedule="0 * * * *" \
            --uri="$$TARGET_URI" \
            --http-method=POST \
            --headers="$$HEADERS_ARG" \
            --message-body='{}' \
            --time-zone="UTC" \
            --project="$PROJECT_ID" || echo "Notice: Service Account lacks Cloud Scheduler create permission."
        fi
        echo "Deployment step completed successfully."

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
