name: Deploy to Google Cloud Run (Secure CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: personal-gemini-journal
  GAR_REPOSITORY: journal-repo
  IMAGE_NAME: personal-gemini-journal

jobs:
  validate-and-test:
    name: 🛡️ Security Audit & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Validate TypeScript Types
        run: npm run lint

      - name: Build Application Bundle
        run: npm run build
        env:
          NODE_ENV: production

  deploy-to-cloud-run:
    name: 🚀 Build Container & Deploy to Cloud Run
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Service Account Key Secret
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Inject Firebase Config for Build if present in Secrets
        run: |
          if [ -n "${{ secrets.FIREBASE_APPLET_CONFIG }}" ]; then
            echo "Injecting firebase-applet-config.json from GitHub Secrets"
            echo '${{ secrets.FIREBASE_APPLET_CONFIG }}' > firebase-applet-config.json
          elif gcloud secrets describe FIREBASE_APPLET_CONFIG --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Restoring firebase-applet-config.json from Google Secret Manager"
            gcloud secrets versions access latest --secret=FIREBASE_APPLET_CONFIG --project="${{ env.PROJECT_ID }}" > firebase-applet-config.json
          elif [ ! -f firebase-applet-config.json ]; then
            echo "Copying empty fallback template for compilation"
            cp firebase-applet-config.example.json firebase-applet-config.json
          fi

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run with Secret Manager Binding
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          SECRETS_PARAM="GEMINI_API_KEY=GEMINI_API_KEY:latest"
          
          # Check if CRON_SECRET exists in Secret Manager
          if gcloud secrets describe CRON_SECRET --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "CRON_SECRET found in Secret Manager, binding to Cloud Run service"
            SECRETS_PARAM="${SECRETS_PARAM},CRON_SECRET=CRON_SECRET:latest"
          fi

          # Check if FIREBASE_APPLET_CONFIG exists in Secret Manager
          if gcloud secrets describe FIREBASE_APPLET_CONFIG --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "FIREBASE_APPLET_CONFIG found in Secret Manager, binding to Cloud Run service"
            SECRETS_PARAM="${SECRETS_PARAM},FIREBASE_APPLET_CONFIG=FIREBASE_APPLET_CONFIG:latest"
          fi

          # Deploys container and attaches secrets from Google Secret Manager
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-secrets="$SECRETS_PARAM" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Provision or Synchronize Hourly Cloud Scheduler Job
        continue-on-error: true
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project="${{ env.PROJECT_ID }}" --format='value(status.url)' 2>/dev/null || true)
          echo "Cloud Run Service URL: $SERVICE_URL"
          
          if [ -z "$SERVICE_URL" ]; then
            echo "Warning: Could not resolve Cloud Run Service URL. Skipping Scheduler configuration."
            exit 0
          fi

          JOB_NAME="hourly-journal-distiller"
          TARGET_URI="${SERVICE_URL}/api/cron/hourly-distill"

          # Determine authorization header if CRON_SECRET is in Secret Manager
          HEADERS_ARG="Content-Type=application/json"
          if gcloud secrets describe CRON_SECRET --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            SECRET_VAL=$(gcloud secrets versions access latest --secret=CRON_SECRET --project="${{ env.PROJECT_ID }}" 2>/dev/null || true)
            if [ -n "$SECRET_VAL" ]; then
              HEADERS_ARG="Content-Type=application/json,Authorization=Bearer ${SECRET_VAL}"
            fi
          fi

          # Attempt enabling Cloud Scheduler API without failing if service account lacks Service Usage Admin
          gcloud services enable cloudscheduler.googleapis.com --project="${{ env.PROJECT_ID }}" --quiet 2>/dev/null || true

          # Create or update Cloud Scheduler job idempotently
          if gcloud scheduler jobs describe "$JOB_NAME" --location="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Updating existing Cloud Scheduler job: $JOB_NAME"
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location="${{ env.REGION }}" \
              --schedule="0 * * * *" \
              --uri="$TARGET_URI" \
              --http-method=POST \
              --headers="$HEADERS_ARG" \
              --message-body='{}' \
              --time-zone="UTC" \
              --project="${{ env.PROJECT_ID }}" || echo "Notice: Service Account lacks Cloud Scheduler update permission. You can configure it directly in GCP Console."
          else
            echo "Attempting to create new Cloud Scheduler job: $JOB_NAME"
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location="${{ env.REGION }}" \
              --schedule="0 * * * *" \
              --uri="$TARGET_URI" \
              --http-method=POST \
              --headers="$HEADERS_ARG" \
              --message-body='{}' \
              --time-zone="UTC" \
              --project="${{ env.PROJECT_ID }}" || echo "Notice: Service Account lacks Cloud Scheduler create permission. You can enable cloudscheduler.googleapis.com and create the job in Cloud Console or Cloud Shell."
          fi
          echo "Deployment completed successfully. Target webhook: $TARGET_URI"
